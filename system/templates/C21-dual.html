<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>C21 同詞雙義卡（物件標本）</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="../../themes/themes.css">
<link rel="stylesheet" href="assets/base.css">
<!-- C21 同詞雙義卡物件標本（規格見 components.md C21）
     本檔只展示物件本體；組頁時把物件塊複製進頁面，組裝參考任務實例庫（page-layouts.md）。
     一個詞當共用大標（.dual-word），兩張定義卡（.dual-card）各裝一個版本，
     小標（.who）寫「誰的版本」。首排實例：「分心是嚴重的缺點嗎」P8。 -->
</head>
<body>
<div class="page center" style="justify-content: center; gap: 48px;">

  <div class="dual-word">「分心」</div>

  <div class="dual-cards">
    <div class="dual-card">
      <div class="who">教室裡的版本</div>
      <div class="def">打擾上課的缺點</div>
    </div>
    <div class="dual-card">
      <div class="who">場域對了的版本</div>
      <div class="def">多工切換的能力</div>
    </div>
  </div>

</div>
</body>
</html>
