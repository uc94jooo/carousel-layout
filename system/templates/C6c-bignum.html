<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>C6c 大數字對照（物件標本）</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="../../themes/themes.css">
<link rel="stylesheet" href="assets/base.css">
<!-- C6c 大數字對照物件標本（規格見 components.md C6 變體）。本檔只展示物件本體；
     組頁時把物件塊複製進頁面，組裝參考任務實例庫（page-layouts.md）。
     主數字 --ink、次數字 .soft 灰階——主客用顏色分，不加卡底不加框。 -->
</head>
<body>
<div class="page center" style="justify-content: center;">

  <div class="versus-num">
    <div class="vn-col">
      <div class="vn-num">46%</div>
      <div class="vn-body">有許下新年願望的那群，<br>半年後還在堅持。</div>
    </div>
    <div class="vn-col soft">
      <div class="vn-num">4%</div>
      <div class="vn-body">而沒許願、只在心裡想想<br>的那群。</div>
    </div>
  </div>

</div>
</body>
</html>
