<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>C6b 非等比對照（物件標本）</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="../../themes/themes.css">
<link rel="stylesheet" href="assets/base.css">
<!-- C6b 非等比對照物件標本（規格見 components.md C6 變體）
     本檔只展示物件本體；組頁時把物件塊複製進頁面，組裝參考任務實例庫（page-layouts.md）。
     寬卡（.major）裝被放大的說法、窄卡（.minor）裝被藏起的說法——寬度即語意，
     窄卡「又小又擠」是功能不是缺陷。兩邊地位平等時用等寬 C6。 -->
<style>
  .major .vs-claim { font-size: 64px; font-weight: 900; font-family: var(--font-head); line-height: 1.4; }
</style>
</head>
<body>
<div class="page center" style="justify-content: center;">

  <div class="versus uneven">
    <div class="versus-card major">
      <div class="vs-title">正面大字</div>
      <div class="vs-claim">「<span class="hl">不易形成<br>體脂肪</span>」</div>
      <div class="vs-body">還拿到認證標章，<br>喝起來咕嚕咕嚕，<br>感覺很有效！</div>
    </div>
    <div class="versus-card minor">
      <div class="vs-title">背面小字</div>
      <div class="vs-body">在嚴謹的營養均衡與熱量控制，以及適當的運動條件下，適量攝取本產品有助於不易形成體脂肪。</div>
    </div>
  </div>

</div>
</body>
</html>
