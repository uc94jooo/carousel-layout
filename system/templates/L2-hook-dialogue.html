<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>L2 hook-dialogue 情境提問頁</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="../../themes/themes.css">
<link rel="stylesheet" href="assets/base.css">
</head>
<body>
<div class="page">
  <div class="h1">你有沒有遇過<br>這種狀況？</div>

  <div class="scenario-card">
    <div class="avatar illust-slot" style="width: 150px; height: 150px; border-radius: 20px; font-size: 24px;">圖位<br>男・無奈</div>
    <div class="lines">
      <div>女友：「你可以<span class="hl">多關心我</span>一點嗎？」</div>
      <div>男友一臉無辜：「我每天三餐都問你吃飽了沒，這不就是關心？」</div>
    </div>
  </div>

  <div class="scenario-card">
    <div class="avatar illust-slot" style="width: 150px; height: 150px; border-radius: 20px; font-size: 24px;">圖位<br>男・理直氣壯</div>
    <div class="lines">
      <div>老婆：「你能不能<span class="hl">多陪陪小孩</span>？」</div>
      <div>老公理直氣壯：「我拚命工作多賺一點，有什麼不對？」</div>
    </div>
  </div>

  <div class="spacer"></div>

  <div class="body" style="text-align: center; font-weight: 700;">
    先思考一下這兩個男生，誰對？<br>
    如果答案都是「<span class="hl">男生錯了</span>」，一起來拆解為什麼<span class="arrow-lead">→</span>
  </div>

  <div class="footer">IG @uncle.johs</div>
</div>
</body>
</html>
