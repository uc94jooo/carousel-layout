<!DOCTYPE html>

<head>

<title>C6d 非等比圖文區（物件標本）</title>

<!-- C6d 非等比圖文區物件標本（規格見 components.md C6 變體）。本檔只展示物件本體；
     組頁時把物件塊複製進頁面，組裝參考任務實例庫（page-layouts.md）。
     左文右圖約 2:1；左欄可換清單等物件；圖位拉高吃留白，圖可省。 -->
</head>
<body>
<div class="page center" style="justify-content: center;">

  <div class="side-list">
    <div class="sl-main">
      <div class="story">
        <div class="body">這裡放普通段落文字，一段兩三行，照一般字數預算斷句。</div>
        <div class="body">第二段繼續說，關鍵詞照 C1 規則加「<span class="hl">螢光筆</span>」。</div>
        <div class="body">段落數量不限，文字長圖位就跟著長。</div>
      </div>
    </div>
    <div class="sl-aside">
      <div class="illust-slot">插畫位（可選）：<br>呼應內文的情境<br>（如思考中的人）</div>
    </div>
  </div>

</div>
</body>
</html>
