<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>L9 flow 流程頁</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="../../themes/themes.css">
<link rel="stylesheet" href="assets/base.css">
<style>
  /* 節點標記槽：編號圓圈（.num-circle）或 icon 插畫（.icon-mark），同頁擇一 */
  .flow-v { --circle: 88px; --fl-font: var(--text-h2); --link-h: 64px; display: flex; flex-direction: column; }
  .flow-v .step { display: flex; align-items: center; gap: 32px; }
  .flow-v .step .label { font-size: var(--fl-font); font-weight: 700; }
  .flow-v .num-circle, .flow-v .icon-mark { width: var(--circle); height: var(--circle); }
  .flow-v .num-circle { font-size: calc(var(--circle) * 0.6); }
  .flow-v .icon-mark { border-radius: 50%; font-size: 22px; flex-shrink: 0; }
  .flow-v .link {
    height: var(--link-h);
    width: var(--circle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    font-weight: 900;
  }
  /* 3～6 步自動縮放：步驟越多，圓圈與字級越小（step 位於奇數子元素） */
  .flow-v:has(.step:nth-child(7))  { --circle: 78px; --fl-font: 42px; --link-h: 48px; }
  .flow-v:has(.step:nth-child(9))  { --circle: 70px; --fl-font: 38px; --link-h: 38px; }
  .flow-v:has(.step:nth-child(11)) { --circle: 62px; --fl-font: 34px; --link-h: 30px; }
</style>
</head>
<body>
<div class="page" style="justify-content: space-between;">
  <div class="h1">一個指標<br>是怎麼慢慢<span class="hl">失效</span>的</div>


  <div class="flow-v">
    <div class="step"><div class="num-circle">1</div><div class="label">先有一個抽象的目標</div></div>
    <div class="link">↓</div>
    <div class="step"><div class="num-circle">2</div><div class="label">找一個數字當<span class="hl">代理指標</span></div></div>
    <div class="link">↓</div>
    <div class="step"><div class="num-circle">3</div><div class="label">大家開始只追這個數字</div></div>
    <div class="link">↓</div>
    <div class="step"><div class="num-circle">4</div><div class="label">數字達標，<span class="hl">目標消失</span></div></div>
  </div>


  <div class="body" style="text-align: center; font-weight: 700;">
    失效不是發生在第 4 步，是發生在第 2 步。
  </div>

  <div class="footer">IG @uncle.johs</div>
</div>
</body>
</html>
